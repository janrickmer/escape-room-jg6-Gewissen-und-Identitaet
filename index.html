/* Cursor an den Anfang bzw. an das Ende eines Blocks setzen. */
function placeCaretAtBlockStart(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  r.setStart(block,0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}
function placeCaretAtBlockEnd(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  let n=block.lastChild; if(n&&n.nodeType===1&&n.tagName==="BR") n=n.previousSibling;
  while(n&&n.nodeType===1&&n.tagName!=="BR"&&n.lastChild) n=n.lastChild;
  if(n&&n.nodeType===3) r.setStart(n,n.nodeValue.length);
  else if(n&&n.parentNode) r.setStartAfter(n);
  else r.setStart(block,0);
  r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
}
/* Cursor in die erste Antwortzeile (erster editierbarer Block) bzw. ans Ende der letzten setzen. */
function focusFirstAnswer(){
  ed.focus();
  const blocks=editorBlocks();
  const first=blocks.find(b=>!isTask(b))||blocks[0];
  placeCaretAtBlockStart(first);
}
function focusLastAnswer(){
  ed.focus();
  const blocks=editorBlocks(); let last=null;
  for(const b of blocks){ if(!isTask(b)) last=b; }
  placeCaretAtBlockEnd(last||blocks[blocks.length-1]);
}

/* ---------- Aufgabenblöcke schützen: nur über das rote „x" entfernbar, nie per Rücktaste/Entf ---------- */
function rangeTouchesTask(r){
  if(!r) return false;
  if(taskOf(r.startContainer)||taskOf(r.endContainer)) return true;
  let live;
  try{ live=document.createRange(); live.setStart(r.startContainer,r.startOffset); live.setEnd(r.endContainer,r.endOffset); }
  catch(e){ return false; }
  if(live.collapsed) return false;
  const tasks=ed.querySelectorAll(".task");
  for(const t of tasks){ if(live.intersectsNode(t)) return true; }
  return false;
}
function selectionTouchesTask(){
  const sel=window.getSelection();
  return !!(sel&&sel.rangeCount&&rangeTouchesTask(sel.getRangeAt(0)));
}
function caretAtBlockStart(r,blk){ const pre=document.createRange(); pre.setStart(blk,0); pre.setEnd(r.startContainer,r.startOffset); return pre.toString().length===0; }
function caretAtBlockEnd(r,blk){ const post=document.createRange(); post.setStart(r.endContainer,r.endOffset); post.setEnd(blk,blk.childNodes.length); return post.toString().length===0; }

ed.addEventListener("beforeinput",(e)=>{
  let hit=false;
  try{ const trs=(typeof e.getTargetRanges==="function")?e.getTargetRanges():[]; for(const tr of trs){ if(rangeTouchesTask(tr)){ hit=true; break; } } }catch(err){}
  if(!hit && selectionTouchesTask()) hit=true;
  if(hit) e.preventDefault();
});
ed.addEventListener("dragstart",(e)=>{ if(taskOf(e.target)) e.preventDefault(); });

/* Klick auf einen Aufgabenblock zeigt das rote „x"; Klick auf das „x" entfernt den Block */
function selectTask(t){
  ed.querySelectorAll(".task.selected").forEach(x=>{ if(x!==t) x.classList.remove("selected"); });
  if(t) t.classList.add("selected");
}
function removeTaskBlock(t){
  if(!t||!ed.contains(t)) return;
  const next=t.nextElementSibling, prev=t.previousElementSibling;
  ed.removeChild(t);
  normalizeBlocks();
  const target=(next&&!isTask(next))?next:((prev&&!isTask(prev))?prev:editorBlocks().find(b=>!isTask(b)));
  ed.focus(); placeCaretAtBlockStart(target); lastCaretBlock=target||null;
  syncTracking("t"); updateCharcount(); updateEmpty(); positionTaskBtn();
}
ed.addEventListener("mousedown",(e)=>{

});

  if(x){ e.preventDefault(); removeTaskBlock(x.closest(".task")); return; }

});

/* ---------- Button „Neuen Aufgabentext eintragen" (schwebt eine Zeile unter der aktuellen Eingabezeile) ---------- */
const taskBtn=$("taskbtn"), taskForm=$("taskform"), taskInput=$("taskinput");
let taskAnchor=null, taskFormOpen=false, lastCaretBlock=null;

function currentBlock(){
  const sel=window.getSelection(); let b=null;
  if(sel&&sel.rangeCount){ const r=sel.getRangeAt(0); if(ed.contains(r.startContainer)) b=blockAt(r.startContainer,r.startOffset); }
  if(!b && lastCaretBlock && ed.contains(lastCaretBlock)) b=lastCaretBlock;
  if(!b){ const bl=editorBlocks(); b=bl[bl.length-1]||null; }
  return b;
}
function positionTaskBtn(){

  const top=blk?(blk.offsetTop+blk.offsetHeight+6):(ed.offsetTop+6);

}
function autoGrow(ta){ ta.style.height="auto"; ta.style.height=Math.max(74,ta.scrollHeight+2)+"px"; }
function openTaskForm(){

function cancelTaskForm(){

/* Bestätigen: Aufgabentext als festen, fetten Block eine Zeile unter der letzten Eingabe einfügen;
   der Cursor springt in die Antwortzeile darunter. */
function confirmTaskForm(){
  const text=taskInput.value.replace(/\r\n?/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  if(!text){ taskInput.focus(); return; }
  const anchor=(taskAnchor&&ed.contains(taskAnchor))?taskAnchor:currentBlock();
  const block=makeTaskBlock("",text);
  let caretBlock;
  if(anchor && !isTask(anchor) && blockIsEmpty(anchor)){
    ed.insertBefore(block,anchor); caretBlock=anchor;          // leere Eingabezeile wird zur Antwortzeile unter der Aufgabe
  } else if(anchor){
    caretBlock=emptyBlock(); ed.insertBefore(block,anchor.nextSibling); ed.insertBefore(caretBlock,block.nextSibling);
  } else {
    caretBlock=emptyBlock(); ed.appendChild(block); ed.appendChild(caretBlock);
  }
  normalizeBlocks();
  closeTaskForm();
  syncTracking("s"); updateCharcount(); updateEmpty();
  ed.focus(); placeCaretAtBlockStart(caretBlock); lastCaretBlock=caretBlock;
  selectTask(null); positionTaskBtn();
  try{ caretBlock.scrollIntoView({block:"nearest"}); }catch(e){}
}

/* Zwischenstand hochladen und weiterarbeiten. Landet eine PDF im falschen Feld, wird sie so geöffnet, wie sie gemeint ist:
   Eine Überblick-PDF aus dem Escape-Room (nur %ESCAPEDATA) startet hier das Finale, eine Feiditor-PDF (%TRACKDATA) im
   Escape-Room-Feld wird mit den gespeicherten Antworten fortgesetzt. Ohne Escape-Room-Weg (z. B. Lerntagebuch) gibt es
   stattdessen einen Hinweis, wo die Überblick-PDF hingehört. */
/* Kennzeile einer PDF: %TRACKDATA steht im Kopf (vor dem ersten Objekt), %ESCAPEDATA im Kopf oder – bei älteren Überblick-PDFs –
   als eigene Zeile hinter dem ersten %%EOF (auch wenn ein PDF-Programm später einen Nachtrag angehängt hat). Nur dort wird
   gesucht (wie im Check), damit Text in der PDF keine Kennzeile vortäuschen kann: Text steht nie am Zeilenanfang. */
function pdfMarker(str,name){
  const re=new RegExp("%"+name+" (\\S+)");
  const end=str.search(/\n\d+ 0 obj\b/);
  let m=(end>0?str.slice(0,end+1):"").match(re);
  if(!m&&name==="ESCAPEDATA"){ const k=str.indexOf("%%EOF"); if(k>=0) m=str.slice(k).match(/\n%ESCAPEDATA ([A-Za-z0-9+\/=]+)(?=\r?\n|$)/); }
  return m;
}
async function readResumePdf(file){
  $("resume-err").textContent="";
  let str;
  try{ str=await readAsBinaryStr(file); }
  catch(err){ $("resume-err").textContent="Der Zwischenstand konnte nicht gelesen werden: "+(err.message||"unbekannter Fehler"); return; }
  if(!pdfMarker(str,"TRACKDATA")&&pdfMarker(str,"ESCAPEDATA")){
    if(CFG.showEscapeUpload) startEscapeFromPdfStr(str,"resume-err");
    else $("resume-err").textContent="Das ist die Überblick-PDF aus einem Escape-Room. Lade sie bitte auf https://feiditor.janrickmer.de/ hoch (Auswahl „Ich komme aus einem Escape-Room …“).";
    return;
  }
  await resumeFromPdfStr(str,"resume-err");
}
async function resumeFromPdfStr(str,errId){
  const mm=pdfMarker(str,"TRACKDATA");
  if(!mm){ $(errId).textContent="In dieser PDF wurden keine Feiditor-Daten gefunden. Bitte lade eine Zwischenstand-PDF aus dem Feiditor hoch."; return; }
  try{
    const {payload}=await autoDecrypt(mm[1]);
    escapeOverviewStreams=(payload&&payload.e&&payload.e.esc)?overviewStreamsFrom(str):[];
    resumeFromPayload(payload);
  }catch(err){
    console.warn("Feiditor-PDF nicht lesbar:",err);
    $(errId).textContent="Diese Feiditor-PDF konnte nicht gelesen werden. Lade bitte die unveränderte Datei hoch, die der Feiditor gespeichert hat.";
  }
}

/* ---------- Escape-Room-Modus: Aufgaben vorbefüllt (Autostart aus dem Escape-Room oder aus der Überblick-PDF) ---------- */
/* Steckbrief des Escape-Rooms für die KI-Bewertung im „Check des Feind(t)es“: Fach, Jahrgangsstufe, Thema, Name des
   Escape-Rooms und die dort erarbeiteten Inhalte. Übernommen werden nur Texte mit begrenzter Länge. */
function cleanEscapeCtx(c){
  if(!c||typeof c!=="object") return null;
  const s=(v,max)=>(typeof v==="string")?v.replace(/\s+/g," ").trim().slice(0,max):"";
  const o={id:s(c.id,60),fach:s(c.fach,120),stufe:s(c.stufe,120),thema:s(c.thema,200),raum:s(c.raum,200),
    inhalte:Array.isArray(c.inhalte)?c.inhalte.map(x=>s(x,400)).filter(Boolean).slice(0,12):[]};
  return (o.fach||o.stufe||o.thema||o.raum||o.inhalte.length)?o:null;
}
function startEscapeMode(v,n,tasks,red,ctx){

/* Export: erzeugt die Text-PDF (mit rotem Moodle-Hinweis); die Tracking-Daten stecken verschlüsselt
   als %TRACKDATA in der PDF und sind über „Zugang für die Lehrkraft → PDF laden + Code" auslesbar.
   interim=true: dieselbe PDF als Zwischenstand („Zwischenstand vom … um … von …"), aus dem sich später
   über die Startseite weiterarbeiten lässt. */
async function exportPdf(interim){
  const btn=interim?$("save-btn"):$("export-btn");
  const ser=syncTracking(justPasted?"p":"t"); justPasted=false;   // Editor und Tracking sicher synchron
  const text=ser.text; const fmt=ser.fmt;
  const name=(studentVorname+" "+studentNachname).trim();
  const old=btn.textContent; btn.disabled=true; btn.textContent="Erzeuge PDF…";
  try{
    const payload=buildPayload(name,ser,studentVorname,studentNachname,!!interim);
    const code=_kf(studentVorname);
    const bundle=await aesEncrypt(JSON.stringify(payload),code);

    const pdfName=interim?interimPdfName():makePdfName();

    // PDF: formatierter Text (Aufgaben fett) + roter Moodle-Hinweis; im Escape-Room zusätzlich die Übersichts-Seiten;
    // Tracking-Daten stecken (verschlüsselt) als %TRACKDATA drin
    const overview=(window.__ESCAPE_DATA__&&window.__ESCAPE_DATA__.overview)||null;
    const pdfStr=buildPdf({name,text,fmt,trackB64:bundle,overview,overviewStreams:escapeOverviewStreams});
    const u8=new Uint8Array(pdfStr.length);
    for(let i=0;i<pdfStr.length;i++)u8[i]=pdfStr.charCodeAt(i)&0xFF;
    // octet-stream im Escape-Room-Modus: erzwingt Speichern statt Anzeigen
    const pdfBlob=new Blob([u8],{type:escapeMode?"application/octet-stream":"application/pdf"});

    // Fallback-Link setzen (bleibt anklickbar, falls der Auto-Download blockiert wird)
    const dlPdf=$("dl-pdf");
    setLink(dlPdf,pdfBlob,pdfName);
    $("dl-panel").classList.remove("hidden");

    // PDF direkt im Klick-Kontext herunterladen
    dlPdf.click();

    btn.textContent=interim?"Zwischenstand gespeichert ✓":"PDF erstellt ✓";
    setTimeout(()=>{ btn.textContent=old; }, 2200);
  }catch(err){ alert("Fehler beim Erzeugen der PDF: "+err.message); btn.textContent=old; }
  finally{ btn.disabled=false; }
}
$("export-btn").addEventListener("click",()=>exportPdf(false));

let teacherBundle=null;

const TRACK_RE=/%TRACKDATA (\S+)/;

function readAsBinaryStr(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const u=new Uint8Array(fr.result);let s="";const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));res(s);};
    fr.onerror=()=>rej(new Error("Datei konnte nicht gelesen werden."));
    fr.readAsArrayBuffer(file);
  });
}
function setCodeFor(text){
  const el=$("code-for"); if(!el) return;
  el.textContent=text?("Einzelansicht für "+text+" – bitte Code eingeben."):"";

}

  }catch(err){ $("teacher-err").textContent=err.message||"Datei konnte nicht gelesen werden."; }
}

/* Code automatisch ermitteln: alle plausiblen Buchstabenzahlen des Vornamens durchprobieren
   (AES-GCM schlägt bei falschem Code sauber fehl) */
async function autoDecrypt(bundle){
  for(let n=0;n<=60;n++){
    const code=_kfN(n);
    try{ const json=await aesDecrypt(bundle,code); return {payload:JSON.parse(json),code}; }catch(e){}
  }
  throw new Error("Code konnte nicht ermittelt werden.");
}
function splitName(p){
  let vn=(p.vn||"").trim(), nn=(p.nn||"").trim();
  if(!vn&&!nn){ // ältere PDFs: nur Gesamtname gespeichert -> am ersten Leerzeichen teilen
    const n=(p.n||"").trim(); const i=n.indexOf(" ");
    if(i<0) vn=n; else { vn=n.slice(0,i); nn=n.slice(i+1).trim(); }
  }
  return {vn,nn};
}
function redPercent(p){ return (typeof p.r==="number"&&isFinite(p.r))?p.r:computeStats(p.t||"",p.m||[]).redPct; }

/* Tabellenansicht: mehrere PDFs */
async function readBatch(files){
  resetTeacherView();
  $("result").innerHTML=`<p class="batchsum">Werte ${files.length} PDF-Dateien aus…</p>`;
  const rows=[];
  for(const f of files){
    try{
      const str=await readAsBinaryStr(f);
      const mm=str.match(TRACK_RE);
      if(!mm) throw new Error("keine Tracking-Daten gefunden");
      const {payload}=await autoDecrypt(mm[1]);
      const nm=splitName(payload);
      rows.push({file:f.name,vn:nm.vn,nn:nm.nn,r:redPercent(payload),bundle:mm[1],z:payload.z===1});
    }catch(err){ rows.push({file:f.name,error:err.message||"Fehler"}); }
  }
  batchRows=rows;
  renderBatchTable();
}
function renderBatchTable(){
  const rows=batchRows.slice();
  rows.sort((a,b)=>{
    if(!!a.error!==!!b.error) return a.error?1:-1;            // Fehlerzeilen ans Ende
    if(!a.error && b.r!==a.r) return b.r-a.r;                  // Rot-Anteil absteigend
    const c=(a.nn||"").localeCompare(b.nn||"","de"); if(c) return c;
    return (a.vn||"").localeCompare(b.vn||"","de");
  });
  const ok=rows.filter(r=>!r.error), high=ok.filter(r=>r.r>RED_LIMIT).length, errs=rows.length-ok.length;
  let html=`<p class="batchsum">${rows.length} PDF-Dateien · ${high} über ${RED_LIMIT} %${errs?` · ${errs} nicht lesbar`:""}</p>`;
  html+='<div class="tablewrap"><table class="batch"><thead><tr><th>Vorname</th><th>Nachname</th><th class="pct">Rot-Anteil</th></tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.error){ html+=`<tr class="errrow"><td colspan="3">${esc(r.file)} – ${esc(r.error)}</td></tr>`; return; }
    const hi=r.r>RED_LIMIT;
    html+=`<tr class="clickable" data-idx="${batchRows.indexOf(r)}" title="Einzelansicht öffnen (Code erforderlich)"><td>${esc(r.vn)}</td><td>${esc(r.nn)}${r.z?" (Zwischenstand)":""}</td><td class="pct${hi?" high":""}">${r.r}&nbsp;%</td></tr>`;
  });
  html+='</tbody></table></div>';
  html+='<p class="batchhint">Rot-Anteil = Anteil der rot markierten Zeichen (eingefügt oder ≤ 0,015 s getippt). Klick auf eine Zeile öffnet die Einzelansicht nach Eingabe des Codes.</p>';
  $("result").innerHTML=html;
  $("code-area").classList.add("hidden"); setCodeFor(""); $("teacher-err").textContent="";
  batchSelected=null; teacherBundle=null;
  $("result").querySelectorAll("tr.clickable").forEach(tr=>tr.addEventListener("click",()=>selectBatchRow(parseInt(tr.dataset.idx,10),tr)));
}
function selectBatchRow(idx,tr){
  const row=batchRows[idx]; if(!row||row.error) return;

  tr.classList.add("selected");

    const objects=[null,null,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
    const pageIds=[];
    for(const page of this.pages){
      objects.push(`<< /Length ${page.content.length} >>\nstream\n${page.content}\nendstream`);
      const contentId=objects.length;
      objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`);
      pageIds.push(objects.length);
    }
    objects[1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0]='<< /Type /Catalog /Pages 2 0 R >>';
    let pdf='%PDF-1.4\n%\xC4\xC5\xC6\xC7\n'+(headComment?headComment.replace(/^\n+|\n+$/g,'')+'\n':''); const offsets=[0];
    for(let i=0;i<objects.length;i++){ offsets.push(pdf.length); pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`; }
    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
    pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
  // Kennung als Kommentarzeile direkt nach dem Kopf (wie %TRACKDATA im Feiditor), nicht hinter %%EOF: so bleibt startxref
  // in den letzten Bytes der Datei und PDF-Werkzeuge müssen nichts reparieren.
  toBase64(headComment){ return btoa(this.build(headComment)); }
}

function translit(s){
  return (s||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/[^a-zA-Z0-9-]/g,'');
}
window.downloadOverviewPDF=()=>{
  try{
    const b64=generateOverviewPdf();
    const clean=(s)=>(s||'').trim().replace(/\s+/g,'-').replace(/[\/\\:*?"<>|]+/g,'');
    const vn=clean(state.firstName)||'Vorname';
    const nn=clean(state.lastName)||'Nachname';
    const filename=`Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    const binary=atob(b64); const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    // application/octet-stream statt application/pdf: Der Browser SPEICHERT die Datei, statt sie
    // anzuzeigen (Firefox-Standard „PDF im Browser öffnen" würde sie sonst nur anzeigen).
    // Die Datei selbst bleibt eine normale PDF; die Endung .pdf kommt über das download-Attribut.
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    // Unsichtbarer Link, synchron im Klick-Handler ausgelöst – kein window.open, kein neuer Tab.
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.style.display='none';
    document.body.appendChild(link);
    link.click();
    // Link und Object-URL erst nach ein paar Sekunden entfernen, damit der Download sicher anläuft.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },5000);
  }catch(e){ console.error(e); alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: '+e.message); }
};

    const tplEl=document.getElementById('feiditor-src');
    if(!tplEl){ alert('Der Feiditor konnte nicht geladen werden.'); return; }
    // Eingebetteten Feiditor-Quelltext holen und die escapten Script-End-Tags wiederherstellen
    let html=tplEl.textContent.replace(/<\\\/script>/gi,'<\/script>');
    // Escape-Room-Daten in den Feiditor injizieren: Name, die sechs Aufgaben, die roten Felder
    // und alle Daten für die Übersichts-Seiten der kombinierten PDF
    const data={
      firstName: state.firstName,
      lastName:  state.lastName,
      birthDate: state.birthDate,
      code:      state.code,
      tasks:     REFLECT_TASKS.slice(0,6),
      redFields: RED_FIELDS,
      ctx:       ROOM_CONTEXT,
      overview:  {
        firstName:     state.firstName,
        lastName:      state.lastName,
        birthDate:     state.birthDate,
        code:          state.code,
        completedAt:   fmtDateTime(state.completedAt),
        attempts:      state.attempts,
        mistakes:      state.mistakes,
        roomLabels:    ROOM_LABELS,
        solutionNotes: SOLUTION_NOTES,
        subtitle:      'Ethik · Klasse 6 · Escape-Room „Lumo und die innere Stimme"',
        resumeNotes:   saveLogPdfLines()
      }
    };
    const inject='<script>window.__ESCAPE_DATA__='+JSON.stringify(data).replace(/</g,'\\u003c')+';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if(html.indexOf('<head>')!==-1) html=html.replace('<head>', '<head>\n'+inject);
    else html=inject+html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    const win=window.open('','_blank');
    if(!win){ alert('Bitte erlaube Pop-ups für diese Seite, damit sich das digitale Arbeitsblatt öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  }catch(e){ console.error(e); alert('Das digitale Arbeitsblatt konnte nicht geöffnet werden: '+e.message); }
};

const root=document.getElementById('screenContainer');

function renderSeals(){
  sealsBox.innerHTML='';
  for(let i=0;i<6;i++){
    const lib=document.createElement('div'); lib.className='seal library';
    const sc=state.screen;
    const isLibActive = (sc==='lib'+(i+1));
    if(isLibActive) lib.classList.add('active');
    else if(state.solved[i] || sc==='room'+(i+1)
      || (sc.startsWith('room') && parseInt(sc.slice(4))>i+1)
      || (sc.startsWith('lib') && parseInt((sc.match(/\d+/)||[0])[0])>i+1)
      || sc==='final') lib.classList.add('visited');
    sealsBox.appendChild(lib);

    const s=document.createElement('div'); s.className='seal';
    if(state.solved[i]){ s.classList.add('solved'); s.textContent=CODE_WORD[i]; s.style.background=LETTER_COLORS[i]; }
    else if(state.screen==='room'+(i+1)){ s.classList.add('active'); s.textContent=i+1; }
    else s.textContent=i+1;
    sealsBox.appendChild(s);
  }
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function byLength(arr,keyFn){ return arr.slice().sort((a,b)=>keyFn(a).length-keyFn(b).length); }
function normalizeAnswer(s){ return (s||'').toLowerCase().replace(/[^a-zäöüß ]/g,'').replace(/\s+/g,' ').trim(); }

window.maskBirth=(el)=>{
  let v=el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out=v;
  if(v.length>4) out=v.slice(0,2)+'.'+v.slice(2,4)+'.'+v.slice(4);
  else if(v.length>2) out=v.slice(0,2)+'.'+v.slice(2);
  el.value=out;
};
window.submitStart=()=>{
  const fn=document.getElementById('firstNameInput').value.trim();
  const ln=document.getElementById('lastNameInput').value.trim();
  const bd=document.getElementById('birthInput').value.trim();
  const err=document.getElementById('startError');
  function showErr(msg){ err.style.display='block'; err.textContent=msg; }
  if(fn.length<2||ln.length<2){ showErr('Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).'); return; }
  const m=bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(!m){ showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 14.09.2014).'); return; }
  const dd=parseInt(m[1],10), mm=parseInt(m[2],10), yyyy=parseInt(m[3],10);
  if(dd<1||dd>31||mm<1||mm>12||yyyy<1900||yyyy>2025){ showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.'); return; }
  state.firstName=fn; state.lastName=ln; state.birthDate=bd;
  const digits=m[1]+m[2]+m[3];
  state.code=computeCode(digits);
  renderIntro();
};

window.checkR6=()=>{
  let allCorrect=true; const errors=[];
  R6_BLANKS.forEach(b=>{
    const el=document.getElementById('r6-'+b.id);
    const val=normalizeAnswer(el.value);
    el.classList.remove('ok','bad');
    if(b.accept.includes(val)){ el.classList.add('ok'); }
    else{ el.classList.add('bad'); allCorrect=false;
      errors.push({kind:'falsche_eingabe', item:'Lücke '+(b.id+1), wrongAnswer:el.value||'(leer)', correctAnswer:b.reveal}); }
  });
  const inputEl=document.getElementById('r6keystone');
  const val=inputEl.value;
  const inputOk=R6_KEYSTONE_ACCEPT.includes(normalizeAnswer(val));
  if(!inputOk){ allCorrect=false; inputEl.style.borderColor='var(--error)'; errors.push({kind:'falsche_eingabe', item:'Schlussstein: Wie nennt man das Gewissen bildhaft?', wrongAnswer:val||'(leer)', correctAnswer:'(innere) Stimme'}); }
  else inputEl.style.borderColor='var(--success)';
  recordAttempt(5,{errors});
  if(allCorrect){ r6Submitted=true; showStatus('success','Richtig','Der letzte Funke leuchtet! Lumos Laterne strahlt wieder in allen Farben.'); setTimeout(()=>triggerReveal(5),800); }
  else{ showStatus('warning','Noch nicht ganz','Prüfe die rot markierten Lücken und den Schlussstein. Verbessere sie und prüfe erneut.'); }
};

function triggerReveal(roomIdx){
  state.solved[roomIdx]=true; state.letters[roomIdx]=CODE_WORD[roomIdx];
  const overlay=document.getElementById('revealOverlay');
  const color=LETTER_COLORS[roomIdx];
  document.getElementById('revealSpark').innerHTML=sparkSvg(color,120);
  const letterEl=document.getElementById('revealLetter');
  letterEl.textContent=CODE_WORD[roomIdx]; letterEl.style.color=color;
  document.getElementById('revealCaption').textContent=`Funke ${roomIdx+1} von 6 entzündet`;
  const progBox=document.getElementById('revealProgress'); progBox.innerHTML='';
  for(let i=0;i<6;i++){ const span=document.createElement('span'); span.className='reveal-progress-letter'+(state.solved[i]?' lit':''); if(state.solved[i]) span.style.background=LETTER_COLORS[i]; span.textContent=state.solved[i]?CODE_WORD[i]:'·'; progBox.appendChild(span); }
  const btn=document.getElementById('revealContinue'); const isLast=roomIdx===5;
  btn.textContent=isLast?'Laterne vollständig entzünden':'Nächste Bibliothek betreten';
  btn.onclick=()=>{ overlay.classList.remove('show'); setTimeout(()=>{ if(isLast) renderFinal(); else goLibrary(roomIdx+2); },250); };
  overlay.classList.add('show');
}
window.goRoom=(n)=>{
  window.scrollTo({top:0,behavior:'instant'});
  switch(n){ case 1:renderRoom1();break; case 2:renderRoom2();break; case 3:renderRoom3();break; case 4:renderRoom4();break; case 5:renderRoom5();break; case 6:renderRoom6();break; }
};

/* ============================================================
   ZWISCHENSTAND ALS DATEI SPEICHERN / AUS DATEI LADEN
   Die Datei (.txt) enthält oben einen lesbaren Hinweistext und
   darunter einen codierten Datenblock mit Prüfsumme. Veränderte,
   beschädigte oder fremde Dateien werden beim Laden abgelehnt.
   Jedes Laden wird in state.resumeLog vermerkt und erscheint am
   Ende der Überblick-PDF (für die Lehrkraft).
   ============================================================ */
const SAVE_FORMAT = 1;
const SAVE_SALT   = 'Zwischenstand|Escape-Room|v1';
const SAVE_BEGIN  = '-----BEGIN ZWISCHENSTAND-----';
const SAVE_END    = '-----END ZWISCHENSTAND-----';
const SAVE_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
const LOAD_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';

function saveHash(str){ // cyrb53-Variante, 64 Bit als 16 Hex-Zeichen
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function saveScramble(bytes){ // symmetrisch: dieselbe Funktion codiert und decodiert
  let s=parseInt(saveHash(SAVE_SALT).slice(0,8),16)>>>0;
  const out=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++){
    s=(s+0x6D2B79F5)>>>0; let t=s;
    t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    out[i]=bytes[i]^((t^(t>>>14))&0xFF);
  }
  return out;
}
function saveEncode(data){
  const json=JSON.stringify(data);
  const wrap=JSON.stringify({ f:SAVE_FORMAT, id:SAVE_ROOM_ID, s:saveHash(SAVE_SALT+'|'+SAVE_ROOM_ID+'|'+json), d:json });
  const bytes=saveScramble(new TextEncoder().encode(wrap));
  let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin).replace(/.{1,76}/g,'$&\r\n').trim();
}
function saveDecode(text){ // wirft Error mit schülergerechter Meldung
  const newer='Diese Zwischenstand-Datei stammt aus einer neueren Version des Escape-Rooms. Bitte lade die Seite neu und versuche es noch einmal.';
  const m=/-----BEGIN ZWISCHENSTAND(?: V(\d+))?-----/.exec(text);   // künftige Formate tragen ihre Nummer im Marker
  const b=m?text.indexOf(SAVE_END,m.index):-1;
  if(!m||b<0) throw new Error('Das ist keine Zwischenstand-Datei. Bitte wähle die Datei „Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom … von …“ aus.');
  if(m[1]&&+m[1]>SAVE_FORMAT) throw new Error(newer);
  const broken='Diese Zwischenstand-Datei wurde verändert oder ist beschädigt und kann nicht geladen werden.';
  let wrap;
  try{
    const bin=atob(text.slice(m.index+m[0].length,b).replace(/[^A-Za-z0-9+/=]/g,''));
    const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    wrap=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(saveScramble(bytes)));
  }catch(e){ throw new Error(broken); }
  if(!wrap||typeof wrap.d!=='string'||typeof wrap.id!=='string'||wrap.s!==saveHash(SAVE_SALT+'|'+wrap.id+'|'+wrap.d)) throw new Error(broken);
  let data; try{ data=JSON.parse(wrap.d); }catch(e){ throw new Error(broken); }
  if(wrap.id!==SAVE_ROOM_ID) throw new Error('Diese Zwischenstand-Datei gehört zu einem anderen Escape-Room'+(data&&data.game?' („'+data.game+'“)':'')+'. Bitte öffne den passenden Escape-Room.');
  if(wrap.f>SAVE_FORMAT) throw new Error(newer);
  if(!data||typeof data!=='object'||!data.state||typeof data.state!=='object'||typeof data.screen!=='string') throw new Error(broken);
  return data;
}

function saveTwo(n){ return String(n).padStart(2,'0'); }
function saveFmtDate(d){ d=new Date(d); return saveTwo(d.getDate())+'.'+saveTwo(d.getMonth()+1)+'.'+d.getFullYear(); }
function saveFmtDateTime(d){ d=new Date(d); if(isNaN(d)) return '–'; return saveFmtDate(d)+' um '+saveTwo(d.getHours())+':'+saveTwo(d.getMinutes())+' Uhr'; }
function saveStudentName(){ return ((state.firstName||'')+' '+(state.lastName||'')).trim(); }
function saveFileName(d){
  const clean=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim();
  return clean('Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom '+saveFmtDate(d)+' von '+(saveStudentName()||'Unbekannt'))+'.txt';
}

/* Toast-Meldung (unten, blendet sich selbst aus) */
let saveToastTimer=null;
function showSaveToast(msg){
  let t=document.getElementById('saveToast');
  if(!t){ t=document.createElement('div'); t.id='saveToast'; t.className='save-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(saveToastTimer); saveToastTimer=setTimeout(()=>t.classList.remove('show'),6000);
}

/* ---------- Speichern ---------- */
window.saveProgress=()=>{
  try{
    const now=new Date();
    const target=saveResumeTarget(state.screen);
    const snap=JSON.parse(JSON.stringify(state));
    snap.screen=target;
    const data={ v:SAVE_FORMAT, game:SAVE_GAME_TITLE, savedAt:now.toISOString(), screen:target, place:saveScreenLabel(target), state:snap, extra:saveCollectExtra() };
    const name=saveStudentName()||'Unbekannt';
    const NL='\r\n';
    const text='\uFEFF'
      +'Zwischenstand zum Escape-Room „'+SAVE_GAME_TITLE+'“'+NL
      +'Name: '+name+NL
      +'Gespeichert am '+saveFmtDateTime(now)+' ('+data.place+')'+NL+NL
      +'So geht es weiter: Öffne den Escape-Room und klicke auf der Startseite ganz unten auf'+NL
      +'„Zwischenstand aus Datei laden und weiterspielen“. Lade dann diese Datei hoch.'+NL
      +'Bitte verändere diese Datei nicht – sonst kann sie nicht mehr geladen werden.'+NL+NL
      +SAVE_BEGIN+NL+saveEncode(data)+NL+SAVE_END+NL;
    const filename=saveFileName(now);
    // application/octet-stream: Der Browser speichert die Datei, statt sie nur anzuzeigen.
    const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.style.display='none';
    document.body.appendChild(link); link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },60000);
    showSaveToast('Zwischenstand gespeichert. Du findest die Datei in deinem Download-Ordner.');
  }catch(e){ console.error(e); alert('Der Zwischenstand konnte nicht gespeichert werden: '+e.message); }
};

/* ---------- Speicher-Button am Seitenende (Bibliotheks- und Rätselräume ab Nr. 2) ---------- */
function refreshSaveBar(){
  const box=document.getElementById(SAVE_CONTAINER_ID); if(!box) return;
  const bar=document.getElementById('saveBar');
  if(!saveScreenAllowed(state.screen)){ if(bar) bar.remove(); return; }
  if(bar&&bar.parentNode===box&&box.lastElementChild===bar) return;
  if(bar) bar.remove();
  box.insertAdjacentHTML('beforeend',
    '<div class="save-bar" id="saveBar"><button type="button" class="save-btn" onclick="saveProgress()" '
    +'title="Lädt eine Datei mit deinem bisherigen Fortschritt herunter. Damit kannst du später an dieser Stelle weiterspielen.">'
    +SAVE_ICON+'<span>Zwischenstand als Datei speichern</span></button></div>');
}
// Jede Bildschirm-Änderung ersetzt den Inhalt des Bildschirm-Containers – dann Button prüfen.
new MutationObserver(refreshSaveBar).observe(document.getElementById(SAVE_CONTAINER_ID),{childList:true});

/* ---------- Feld auf der Startseite ---------- */
function saveLoadFieldHtml(){
  return '<button type="button" class="save-load-field" onclick="renderResume()">'+LOAD_ICON
    +'<span>Zwischenstand aus Datei laden und weiterspielen</span></button>';
}

/* ---------- Laden ---------- */
function saveApplyState(snap){
  Object.keys(state).forEach(k=>{
    if(k==='screen'||!(k in snap)) return;
    const cur=state[k], val=snap[k];
    if(k==='completedAt'){ state[k]=val?new Date(val):null; return; }
    if(Array.isArray(cur)){ if(Array.isArray(val)) state[k]=val; return; }
    if(cur===null||val===null||typeof cur===typeof val) state[k]=val;
  });
  state.resumeLog=Array.isArray(state.resumeLog)?state.resumeLog.filter(e=>e&&typeof e==='object'&&typeof e.place==='string'):[];
}
function saveLoadText(text){
  const data=saveDecode(text);
  saveApplyState(data.state);
  saveApplyExtra(data.extra||{},data);
  state.resumeLog.push({ place:String(data.place||saveScreenLabel(data.screen)), savedAt:String(data.savedAt||''), loadedAt:new Date().toISOString() });
  saveGoTo(data.screen);
  window.scrollTo({top:0,behavior:'instant'});
  showSaveToast('Willkommen zurück'+(state.firstName?', '+state.firstName:'')+'! Dein Zwischenstand vom '+saveFmtDateTime(data.savedAt)+' wurde geladen.');
}
function saveHandleFile(file){
  const err=document.getElementById('saveLoadError');
  const fail=msg=>{ if(err){ err.style.display='block'; err.textContent=msg; } };
  if(err) err.style.display='none';
  if(!file) return;
  if(file.size>2*1024*1024){ fail('Diese Datei ist zu groß für eine Zwischenstand-Datei.'); return; }
  const fr=new FileReader();
  fr.onload=()=>{ try{ saveLoadText(String(fr.result||'')); }catch(e){ console.warn(e); fail(e.message); } };
  fr.onerror=()=>fail('Die Datei konnte nicht gelesen werden. Bitte versuche es noch einmal.');
  fr.readAsText(file,'utf-8');
}
window.renderResume=()=>{
  state.screen='resume';
  saveRenderResumeScreen();   // Anpassung: zeichnet die Upload-Seite (IDs saveDrop, saveFileInput, saveLoadError)
  const input=document.getElementById('saveFileInput'), drop=document.getElementById('saveDrop');
  input.addEventListener('change',()=>{ saveHandleFile(input.files&&input.files[0]); input.value=''; });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.add('drag')));
  drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
};
// Dateien, die irgendwo auf der Upload-Seite abgelegt werden, laden (statt sie im Browser zu öffnen).
document.addEventListener('dragover',e=>{ if(state.screen==='resume') e.preventDefault(); });
document.addEventListener('drop',e=>{
  if(state.screen!=='resume') return;
  e.preventDefault();
  const drop=document.getElementById('saveDrop'); if(drop) drop.classList.remove('drag');
  saveHandleFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);
});
function saveDropHtml(){
  return '<label class="save-drop" id="saveDrop">'+LOAD_ICON
    +'<span><strong>Zwischenstand-Datei auswählen</strong><br>oder hierher ziehen</span>'
    +'<input type="file" id="saveFileInput" accept=".txt,text/plain"></label>'
    +'<div id="saveLoadError" class="input-error" role="alert"></div>';
}

/* ---------- Vermerk für die Überblick-PDF ---------- */
function saveLogPdfLines(){
  const log=Array.isArray(state.resumeLog)?state.resumeLog:[];
  if(!log.length) return ['Es wurde keine Zwischenstand-Datei geladen.'];
  const lines=[log.length===1?'Es wurde 1-mal eine Zwischenstand-Datei geladen:':'Es wurde '+log.length+'-mal eine Zwischenstand-Datei geladen:'];
  log.forEach((e,i)=>lines.push((i+1)+'. Weitergespielt ab '+e.place+' (Datei gespeichert am '+saveFmtDateTime(e.savedAt)+', geladen am '+saveFmtDateTime(e.loadedAt)+').'));
  return lines;
}

/* ============================================================
   INIT
   ============================================================ */
renderStart();
</script>
